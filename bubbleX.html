function burst(x,y,color){
  for (let i=0;i<9;i++){
    const a = Math.random()*Math.PI*2, sp = 1+Math.random()*3.4;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}
function crack(x,y){ for (let i=0;i<5;i++) particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:.8,color:'#bfe6ff'}); }
/* ══════════ 文字特效 ══════════ */
const PRAISE = [
  [3,  'NICE!',          '不錯'],
  [5,  'GREAT!',         '很好'],
  [8,  'EXCELLENT!',     '精彩'],
  [12, 'AMAZING!',       '驚人'],
  [18, 'INCREDIBLE!',    '不可思議'],
  [26, 'UNBELIEVABLE!',  '神乎其技']
];
const CHEER = ['好厲害！','你好棒','再來一次！','超級厲害','哇～漂亮','繼續加油！','你做到了'];

function fx(kind, text, x, y, o){
  floaters.push(Object.assign({
    kind, text, x, y, life:1, t:0, sub:'', hue:44,
    rot:(Math.random()-.5)*0.1
  }, o||{}));
}
function toast(text){ fx('toast', text, W/2, 300); }
function itemFx(text){ fx('item', text, W/2, 268, {hue:190}); }
/* 禮盒揭曉：大字卡，停留約四秒才淡出 */
/* 開箱提示：就在禮盒炸開的位置浮出，緩慢下飄，四秒淡出。
   多個禮盒同時開就各自顯示，互不覆蓋。 */
function revealFx(ico, name, tip, hue, head, x, y){
  const px = Math.max(96, Math.min(W-96, x==null ? W/2 : x));
  const py = Math.max(TOP+52, Math.min(DEATH-66, y==null ? 230 : y));
  fx('gift', name, px, py, {ico, sub:tip, hue:(hue==null?44:hue), head});
}
function scorePop(v, x, y){ if (v>0) fx('score', '+'+v, x, y); }

function praise(total, ch){
  let lv = -1;
  for (let i=0;i<PRAISE.length;i++) if (total >= PRAISE[i][0]) lv = i;
  if (lv < 0) return;
  const [, en, zh] = PRAISE[lv];
  const y = 190 + floaters.filter(f=>f.kind==='praise').length*46;
  fx('praise', en, W/2, y, {sub:zh, hue:44 - lv*7, big:1 + lv*0.09});
  for (let i=0;i<10+lv*5;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*5;
    particles.push({x:W/2, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:1, color:'#ffd166'});
  }
  if (ch >= 3 && Math.random() < .6)
    fx('toast', CHEER[(Math.random()*CHEER.length)|0], W/2, y+52);
}
function comboFx(n){
  fx('praise', 'COMBO ×'+n, W/2, 150, {hue:196, big:.82, sub:''});
}

/* ══════════ 繪圖 ══════════ */
function shade(hex,amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f=(v)=>Math.round(v+(amt<0?v:255-v)*amt);
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex,a){
  const n = parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
/* 保齡球：金屬重球 + 三孔 + 尾跡 */
function drawBowl(s){
  const r = R*1.25;
  for (let i=1;i<=4;i++){                          // 尾跡
    ctx.globalAlpha = .13*(5-i)/4;
    ctx.fillStyle = '#9aa6c4';
    ctx.beginPath(); ctx.arc(s.x - s.vx*i*0.55, s.y - s.vy*i*0.55, r*(1-i*0.11), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(s.x-r*.35, s.y-r*.4, r*.05, s.x, s.y, r);
  g.addColorStop(0,'#eef2fb'); g.addColorStop(.35,'#8b96b4');
  g.addColorStop(.78,'#39415c'); g.addColorStop(1,'#1b2030');
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = 'rgba(8,10,18,.78)';             // 三個指孔
  for (const [dx,dy] of [[-.26,-.10],[.02,-.24],[.26,-.04]]){
    ctx.beginPath(); ctx.arc(s.x+dx*r, s.y+dy*r, r*.13, 0, 7); ctx.fill();
  }
  ctx.save();
  ctx.translate(s.x-r*.34, s.y-r*.4); ctx.rotate(-Math.PI/5);
  const hg = ctx.createRadialGradient(0,0,0,0,0,r*.4);
  hg.addColorStop(0,'rgba(255,255,255,.95)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(0,0,r*.36,r*.2,0,0,7); ctx.fill();
  ctx.restore();
}

/* 小丑面具：蓋在彈室上，讓人看不出顏色 */
/* 側面小貓：跳躍中身體拉長，落地瞬間壓扁 */
function drawCat(){
  if (!cat) return;
  const t = performance.now();
  const sq = cat.squash / 5;                       // 落地壓扁
  const air = cat.t / CAT_DUR;
  const stretch = 1 + Math.sin(air*Math.PI) * 0.12;
  ctx.save();
  ctx.translate(cat.x, cat.y);
  ctx.scale(cat.dir * (1 + sq*0.28), (1 - sq*0.26) * stretch);

  const body = '#f7c873', dark = '#d99f45', ink = '#2a2216';
  // 尾巴
  ctx.strokeStyle = body; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-13, 2);
  ctx.quadraticCurveTo(-25, -4 + Math.sin(t*0.012)*5, -21, -15 + Math.sin(t*0.012)*4);
  ctx.stroke();
  // 後腳
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-8, 9, 5, 3.4, 0, 0, 7); ctx.fill();
  // 身體
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(-3, 2, 13, 9, -0.08, 0, 7); ctx.fill();
  // 前腳
  ctx.beginPath(); ctx.ellipse(7, 9, 4.6, 3.2, 0, 0, 7); ctx.fill();
  // 頭
  ctx.beginPath(); ctx.arc(9, -6, 8.6, 0, 7); ctx.fill();
  // 耳朵
  ctx.beginPath();
  ctx.moveTo(3.5, -12); ctx.lineTo(5, -20); ctx.lineTo(11, -13.5); ctx.closePath(); ctx.fill();
  ctx.moveTo(12, -13.5); ctx.lineTo(16.5, -19.5); ctx.lineTo(17.5, -11); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb3c6';
  ctx.beginPath();
  ctx.moveTo(5.4, -13); ctx.lineTo(6.2, -17.6); ctx.lineTo(9.6, -13.8); ctx.closePath(); ctx.fill();
  // 臉
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.arc(12.6, -7.6, 1.5, 0, 7); ctx.fill();     // 眼
  ctx.beginPath(); ctx.arc(6.4, -7.6, 1.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8fa3';
  ctx.beginPath(); ctx.arc(9.6, -3.6, 1.5, 0, 7); ctx.fill();      // 鼻
  ctx.strokeStyle = 'rgba(42,34,22,.55)'; ctx.lineWidth = .9;      // 鬍鬚
  for (const dy of [-1.2, 0.6, 2.4]){
    ctx.beginPath(); ctx.moveTo(12, -3.4+dy*.5); ctx.lineTo(20, -4.4+dy); ctx.stroke();
  }
  ctx.restore();

  // 落地灰塵
  if (cat.squash === 5)
    for (let i=0;i<5;i++)
      particles.push({x:cat.x+(Math.random()-.5)*12, y:cat.y+9,
        vx:(Math.random()-.5)*3, vy:-Math.random()*1.4, life:.55, color:'#ffd9a0'});
}

function drawClown(x, y, r){
  const t = performance.now();
  const wob = Math.sin(t*0.005 + x*0.05) * 0.13;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(wob);

  ctx.fillStyle = '#ff7a3d';                       // 兩側絨球頭髮
  for (const sx of [-1, 1]){
    ctx.beginPath(); ctx.arc(sx*r*0.80, -r*0.28, r*0.32, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(120,50,20,.35)'; ctx.lineWidth = 1;
  for (const sx of [-1, 1]){
    ctx.beginPath(); ctx.arc(sx*r*0.80, -r*0.28, r*0.32, 0, 7); ctx.stroke();
  }

  const g = ctx.createRadialGradient(-r*.32, -r*.36, r*.08, 0, 0, r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.68,'#f6efe2'); g.addColorStop(1,'#cec2ae');
  ctx.beginPath(); ctx.arc(0, 0, r-1, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.38)'; ctx.lineWidth = 1.1; ctx.stroke();

  ctx.strokeStyle = '#1d2333';                     // 叉叉眼
  ctx.lineWidth = Math.max(1.3, r*0.115); ctx.lineCap = 'round';
  for (const sx of [-1, 1]){
    const ex = sx*r*0.33, ey = -r*0.17, s2 = r*0.155;
    ctx.beginPath();
    ctx.moveTo(ex-s2, ey-s2); ctx.lineTo(ex+s2, ey+s2);
    ctx.moveTo(ex+s2, ey-s2); ctx.lineTo(ex-s2, ey+s2);
    ctx.stroke();
  }

  ctx.strokeStyle = '#ff3b52';                     // 大笑
  ctx.lineWidth = Math.max(1.3, r*0.13);
  ctx.beginPath(); ctx.arc(0, r*0.12, r*0.46, 0.20*Math.PI, 0.80*Math.PI); ctx.stroke();

  ctx.fillStyle = '#ff3b52';                       // 紅鼻子
  ctx.beginPath(); ctx.arc(0, r*0.10, r*0.21, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.beginPath(); ctx.arc(-r*0.08, r*0.03, r*0.075, 0, 7); ctx.fill();
  ctx.restore();
}

function drawBubble(x,y,b,rad){
  const r = (rad||R) - 0.5;

  if (b.type === 'stone'){                       // 霧面磨砂玻璃
    ctx.beginPath(); ctx.arc(x,y,r,0,7);
    let sg = ctx.createRadialGradient(x-r*.28,y-r*.3,r*.05,x,y,r);
    sg.addColorStop(0,'rgba(190,199,216,.42)');
    sg.addColorStop(.62,'rgba(120,131,158,.46)');
    sg.addColorStop(.92,'rgba(74,84,108,.86)');
    sg.addColorStop(1,'rgba(150,160,182,.9)');
    ctx.fillStyle=sg; ctx.fill();
    ctx.strokeStyle='rgba(210,220,240,.5)'; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.arc(x,y,r-.5,0,7); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.3;
    ctx.beginPath();
    ctx.moveTo(x-r*.38,y-r*.08); ctx.lineTo(x+r*.06,y+r*.34);
    ctx.moveTo(x+r*.14,y-r*.38); ctx.lineTo(x+r*.42,y-r*.02);
    ctx.stroke();
    ctx.save(); ctx.translate(x-r*.3,y-r*.36); ctx.rotate(-Math.PI/5);
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.ellipse(0,0,r*.34,r*.17,0,0,7); ctx.fill(); ctx.restore();
    return;
  }

  const col = b.color;
  const circle = () => { ctx.beginPath(); ctx.arc(x,y,r,0,7); };

  // 1. 玻璃本體：中心近乎透明，邊緣濃縮
  circle();
  let g = ctx.createRadialGradient(x-r*.22,y-r*.28,r*.04, x,y,r);
  g.addColorStop(0,   rgba(col,.05));
  g.addColorStop(.40, rgba(col,.18));
  g.addColorStop(.70, rgba(col,.40));
  g.addColorStop(.90, rgba(col,.80));
  g.addColorStop(1,   rgba(col,.96));
  ctx.fillStyle = g; ctx.fill();

  // 2. 薄膜邊緣輝光（加色混合）
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  circle();
  let g2 = ctx.createRadialGradient(x,y,r*.5, x,y,r);
  g2.addColorStop(0,'rgba(255,255,255,0)');
  g2.addColorStop(.80,'rgba(255,255,255,.045)');
  g2.addColorStop(1,'rgba(255,255,255,.30)');
  ctx.fillStyle = g2; ctx.fill();
  // 3. 底部折射聚光
  circle();
  let g3 = ctx.createRadialGradient(x+r*.12,y+r*.48,r*.02, x+r*.12,y+r*.48,r*.72);
  g3.addColorStop(0, rgba(col,.5));
  g3.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g3; ctx.fill();
  ctx.restore();

  // 4. 雙層薄膜輪廓
  ctx.strokeStyle = rgba(col,.85); ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(x,y,r-.4,0,7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.arc(x,y,r-1.7,0,7); ctx.stroke();

  // 5. 底緣輪廓光
  ctx.strokeStyle = 'rgba(255,255,255,.42)'; ctx.lineWidth = 1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,y,r-1.4, Math.PI*.20, Math.PI*.62); ctx.stroke();
  ctx.lineCap='butt';

  // 6. 主反光（斜橢圓）＋ 次反光點
  ctx.save();
  ctx.translate(x-r*.32, y-r*.38); ctx.rotate(-Math.PI/5);
  let hg = ctx.createRadialGradient(0,0,0, 0,0,r*.42);
  hg.addColorStop(0,'rgba(255,255,255,.95)');
  hg.addColorStop(.45,'rgba(255,255,255,.38)');
  hg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.ellipse(0,0,r*.40,r*.24,0,0,7); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.ellipse(x+r*.36,y+r*.26,r*.12,r*.08,-Math.PI/5,0,7); ctx.fill();

  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  if (b.type === 'ice'){
    ctx.fillStyle='rgba(196,232,255,.30)';
    ctx.beginPath(); ctx.arc(x,y,r-1.5,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.5; ctx.lineCap='round';
    ctx.beginPath();
    for (let i=0;i<3;i++){ const a=i*Math.PI/3; ctx.moveTo(x-Math.cos(a)*r*.58,y-Math.sin(a)*r*.58); ctx.lineTo(x+Math.cos(a)*r*.58,y+Math.sin(a)*r*.58); }
    ctx.stroke(); ctx.lineCap='butt';
  } else if (b.type === 'bomb'){
    ctx.fillStyle='rgba(12,14,22,.62)';
    ctx.beginPath(); ctx.arc(x,y,r*.5,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,r*.5,0,7); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font='bold '+(r*.76)+'px system-ui'; ctx.fillText('✱',x,y+1);
  } else if (b.type === 'line'){
    ctx.fillStyle='rgba(12,14,22,.5)';
    ctx.beginPath(); ctx.roundRect(x-r*.72,y-r*.24,r*1.44,r*.48,r*.24); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font='bold '+(r*.6)+'px system-ui'; ctx.fillText('↔',x,y+1);
  } else if (b.type === 'plus'){
    ctx.fillStyle='rgba(12,14,22,.55)'; ctx.beginPath(); ctx.arc(x,y,r*.53,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font='bold '+(r*.52)+'px system-ui'; ctx.fillText('+2',x,y+1);
  } else if (b.type === 'gift'){        // 保有顏色，只是綁上金色緞帶
    const ph = (b.t = (b.t||0) + 1) * 0.05;
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,r-1.5,0,7); ctx.clip();
    const rg = ctx.createLinearGradient(x-r,y-r,x+r,y+r);
    rg.addColorStop(0,'rgba(255,247,214,.95)');
    rg.addColorStop(.5,'rgba(255,205,90,.92)');
    rg.addColorStop(1,'rgba(255,247,214,.95)');
    ctx.fillStyle = rg;
    ctx.fillRect(x-r*.15, y-r, r*.30, r*2);        // 直緞帶
    ctx.fillRect(x-r, y-r*.15, r*2, r*.30);        // 橫緞帶
    ctx.strokeStyle='rgba(190,120,20,.5)'; ctx.lineWidth=.9;
    ctx.beginPath();
    ctx.moveTo(x-r*.15,y-r); ctx.lineTo(x-r*.15,y+r);
    ctx.moveTo(x+r*.15,y-r); ctx.lineTo(x+r*.15,y+r);
    ctx.moveTo(x-r,y-r*.15); ctx.lineTo(x+r,y-r*.15);
    ctx.moveTo(x-r,y+r*.15); ctx.lineTo(x+r,y+r*.15);
    ctx.stroke();
    ctx.restore();
    ctx.save();                                     // 蝴蝶結
    ctx.fillStyle='rgba(255,252,236,.98)';
    ctx.beginPath(); ctx.ellipse(x-r*.24,y-r*.44,r*.21,r*.13,-0.55,0,7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+r*.24,y-r*.44,r*.21,r*.13, 0.55,0,7); ctx.fill();
    ctx.strokeStyle='rgba(210,145,30,.6)'; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.ellipse(x-r*.24,y-r*.44,r*.21,r*.13,-0.55,0,7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x+r*.24,y-r*.44,r*.21,r*.13, 0.55,0,7); ctx.stroke();
    ctx.fillStyle='#fffdf2';
    ctx.beginPath(); ctx.arc(x,y-r*.44,r*.10,0,7); ctx.fill();
    ctx.restore();
    ctx.save();                                     // 脈動光暈
    ctx.globalAlpha = .26 + .22*Math.sin(ph*1.7);
    ctx.strokeStyle='#ffd166'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.arc(x,y,r+2.6,0,7); ctx.stroke();
    ctx.restore();
    if (b.held && slotsFull()){                     // 格子滿：畫一把小鎖表示暫時打不掉
      ctx.save();
      ctx.translate(x, y + r*0.42);
      ctx.fillStyle = 'rgba(12,14,22,.75)';
      ctx.beginPath(); ctx.roundRect(-r*0.26, -r*0.16, r*0.52, r*0.34, r*0.09); ctx.fill();
      ctx.strokeStyle = 'rgba(255,232,170,.95)'; ctx.lineWidth = Math.max(1, r*0.075);
      ctx.beginPath(); ctx.arc(0, -r*0.16, r*0.15, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(-r*0.26, -r*0.16, r*0.52, r*0.34, r*0.09); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

/* 模擬瞄準軌跡（不畫任何東西），回傳折點與命中的格子 */
function traceAim(){
  const key = armed && armed.key;
  const straight = key === 'fire';
  const plough = key === 'bowl';                  // 保齡球貫穿但會撞牆反彈
  const phase = (key === 'pierce' || key === 'dye');
  const myColor = mag[0] && mag[0].color;
  let x=SHOOTER.x, y=SHOOTER.y, vx=Math.cos(angle)*7, vy=Math.sin(angle)*7;
  const pts=[[x,y]];
  let cell=null, cool=0;
  for (let i=0;i<400;i++){
    x+=vx; y+=vy;
    if (!straight){
      if (x<R){ x=R; vx*=-1; pts.push([x,y]); }
      if (x>W-R){ x=W-R; vx*=-1; pts.push([x,y]); }
    }
    if (y-R<=TOP || x<-R || x>W+R) break;
    if (straight || plough) continue;
    if (cool>0){ cool--; continue; }
    const h = hitTest(x,y);
    if (h){
      if (phase){                                 // 穿透／染色：條件不成立就穿過去
        const b = at(h[0], h[1]);
        const ok = (key === 'pierce') ? wouldClear(x, y, myColor)
                                      : (b && b.color === myColor);
        if (ok){ cell = h; break; }
        cool = PIERCE_COOL; continue;
      }
      cell = h; break;
    }
  }
  pts.push([x,y]);
  return {pts, cell, end:[x,y], straight, key, myColor};
}

function guide(info){
  const {pts, end} = info;
  ctx.save(); ctx.setLineDash([5,9]); ctx.lineWidth=2; ctx.lineCap='round';
  const dragging = !!dragFrom && touchAim;
  ctx.lineWidth = dragging ? 3 : 2;
  ctx.strokeStyle = armed ? 'rgba(255,209,102,'+(dragging?.85:.6)+')'
                          : 'rgba(232,236,245,'+(dragging?.55:.3)+')';
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.stroke(); ctx.restore();
  ctx.fillStyle='rgba(232,236,245,.5)';
  ctx.beginPath(); ctx.arc(end[0],end[1],4,0,7); ctx.fill();
}

/* 炸彈爆炸範圍（與 bombAt 同一套 BFS，深度 2） */
function blastCells(cell){
  const set=new Set(), st=[[cell[0],cell[1],0]];
  while (st.length){
    const [r,c,d] = st.pop(), k = r+','+c;
    if (set.has(k) || !at(r,c)) continue;
    set.add(k);
    if (d<2) for (const [nr,nc] of nbrs(r,c)) st.push([nr,nc,d+1]);
  }
  return set;
}

/* 火球沿路燒到的泡泡（與 fireballStep 同一個半徑 R*1.5） */
function pathCells(pts, cap){
  const set=new Set();
  for (let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const n = Math.max(2, Math.ceil(Math.hypot(x1-x0,y1-y0)/7));
    for (let s2=0;s2<=n;s2++){
      const x = x0+(x1-x0)*s2/n, y = y0+(y1-y0)*s2/n;
      for (let r=0;r<grid.length;r++)
        for (let c=0;c<len(r);c++){
          if (!grid[r].cells[c]) continue;
          const k = r+','+c;
          if (set.has(k)) continue;
          if (Math.hypot(x-cx(r,c), y-cy(r)) < R*1.5){
            set.add(k);
            if (cap && set.size >= cap) return set;
          }
        }
    }
  }
  return set;
}

/* 反白：把即將被清掉的泡泡打亮並套上跑動虛線框 */
function drawPreview(info){
  if (!armed) return;
  let set = null, hue = 30, tint = null, verb = '顆';
  if (armed.key === 'bomb' && info.cell){ set = blastCells(info.cell); hue = 18; }
  else if (armed.key === 'fire'){ set = pathCells(info.pts); hue = 34; }
  else if (armed.key === 'bowl'){ set = pathCells(info.pts, 3); hue = 212; }
  else if (armed.key === 'dye' && info.cell){          // 染色範圍＝爆炸範圍
    set = blastCells(info.cell);
    hue = COLOR_HUE[COLORS.indexOf(info.myColor)] || 44;
    tint = info.myColor; verb = '顆要染色';
  }
  else if (armed.key === 'cat' && info.cell){
    const pth = catPath(info.cell[0], info.cell[1]);
    set = new Set(pth.map(a => a[0]+','+a[1]));
    hue = 40; verb = '顆要踩破';
  }
  else if (armed.key === 'pierce' && info.cell){        // 會被消掉的那一群
    const cc = snap(info.end[0], info.end[1]);
    if (cc){
      grid[cc[0]].cells[cc[1]] = {color:info.myColor, type:'normal'};
      set = new Set(cluster(cc[0], cc[1]).map(a => a[0]+','+a[1]));
      grid[cc[0]].cells[cc[1]] = null;
      set.delete(cc[0]+','+cc[1]);
      hue = 190; verb = '顆要消除';
    }
  }
  if (!set || !set.size) return;

  const t = performance.now();
  const pulse = .5 + .5*Math.sin(t*0.007);
  let gift = 0;

  for (const k of set){
    const [r,c] = k.split(',').map(Number);
    const b = at(r,c); if (!b) continue;
    if (b.type === 'gift') gift++;
    const X = cx(r,c), Y = cy(r);
    ctx.save();                                   // 打亮
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .26 + .20*pulse;
    ctx.fillStyle = b.type === 'gift' ? '#ffd166' : (tint || '#ffffff');
    ctx.beginPath(); ctx.arc(X,Y,R-2,0,7); ctx.fill();
    ctx.restore();
    ctx.save();                                   // 跑動虛線框
    ctx.setLineDash([4.5,4.5]);
    ctx.lineDashOffset = -(t*0.05) % 9;
    ctx.strokeStyle = 'hsla('+(b.type==='gift'?44:hue)+',100%,'+(70+10*pulse)+'%,'+(.65+.3*pulse)+')';
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(X,Y,R+1.5,0,7); ctx.stroke();
    ctx.restore();
  }

  const label = set.size + ' ' + verb + (gift ? '　🎁×'+gift : '');
  const p = info.cell ? [cx(info.cell[0], info.cell[1]), cy(info.cell[0])]
                      : [info.end[0], info.end[1] + 34];
  ctx.save();
  ctx.font = '700 13px "Noto Sans TC",system-ui,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const wl = ctx.measureText(label).width + 18;
  const bx = Math.max(wl/2+4, Math.min(W-wl/2-4, p[0]));
  const by = Math.max(TOP+16, p[1] - R - 16);
  ctx.fillStyle = 'rgba(10,13,22,.82)';
  ctx.beginPath(); ctx.roundRect(bx-wl/2, by-10, wl, 20, 10); ctx.fill();
  ctx.strokeStyle = 'hsla('+hue+',100%,68%,.8)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.roundRect(bx-wl/2, by-10, wl, 20, 10); ctx.stroke();
  ctx.fillStyle = '#ffe9b0';
  ctx.fillText(label, bx, by);
  ctx.restore();
}

/* ── 左輪式彈倉 ── */
function drawWheel(){
  const {x, y, r, rim} = WHEEL;

  // 座台陰影
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(x, y+rim*.58, rim*.98, rim*.24, 0,0,7); ctx.fill();

  // 外圈金屬座（斜向打光）
  let mg = ctx.createLinearGradient(x-rim, y-rim, x+rim, y+rim);
  mg.addColorStop(0,'#7885ad'); mg.addColorStop(.32,'#3d4664');
  mg.addColorStop(.60,'#1f2536'); mg.addColorStop(.85,'#39425e'); mg.addColorStop(1,'#5d688c');
  ctx.beginPath(); ctx.arc(x,y,rim,0,7); ctx.fillStyle = mg; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(x,y,rim-.8,0,7); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(x,y,rim-4,0,7); ctx.stroke();

  // 座台上的固定鉚釘
  for (let i=0;i<save.magCap;i++){
    const a = -Math.PI/2 + (i+.5)*STEPA();
    const px = x+Math.cos(a)*(rim-2.2), py = y+Math.sin(a)*(rim-2.2);
    ctx.fillStyle='rgba(180,192,220,.55)';
    ctx.beginPath(); ctx.arc(px,py,1.8,0,7); ctx.fill();
  }

  // 轉動的滾筒
  ctx.save(); ctx.translate(x,y); ctx.rotate(wheelA);
  let cg = ctx.createLinearGradient(-rim,-rim, rim, rim);
  cg.addColorStop(0,'#414c6b'); cg.addColorStop(.45,'#1b2130'); cg.addColorStop(1,'#333c56');
  ctx.beginPath(); ctx.arc(0,0,rim-6,0,7); ctx.fillStyle=cg; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,rim-6.5,0,7); ctx.stroke();
  ctx.lineCap='round';
  for (let i=0;i<save.magCap;i++){                       // 分室刻線
    const a = -Math.PI/2 + (i+.5)*STEPA();
    ctx.strokeStyle='rgba(255,255,255,.11)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*(r-8), Math.sin(a)*(r-8));
    ctx.lineTo(Math.cos(a)*(rim-8), Math.sin(a)*(rim-8));
    ctx.stroke();
  }
  ctx.lineCap='butt';
  ctx.restore();

  // 砲管（藏在裝填口的泡泡底下）
  ctx.save();
  ctx.translate(SHOOTER.x, SHOOTER.y); ctx.rotate(angle + Math.PI/2);
  let bg2 = ctx.createLinearGradient(-7,0,7,0);
  bg2.addColorStop(0,'#5b678a'); bg2.addColorStop(.45,'#232a3d'); bg2.addColorStop(1,'#48527180');
  ctx.fillStyle = armed ? '#8a7130' : bg2;
  ctx.beginPath(); ctx.roundRect(-6.5,-36,13,40,3.5); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-3.4,-33); ctx.lineTo(-3.4,-4); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,-36); ctx.lineTo(0,-4); ctx.stroke();
  ctx.restore();

  // 彈室：依「接近裝填口的程度」排序，裝填位最後畫
  const order = [];
  for (let i=0;i<save.magCap;i++){
    const aa = -Math.PI/2 + i*STEPA() + wheelA;
    const dd = Math.atan2(Math.sin(aa+Math.PI/2), Math.cos(aa+Math.PI/2));
    order.push([i, Math.max(0, 1 - Math.abs(dd)/STEPA())]);
  }
  order.sort((p,q) => p[1]-q[1]);
  for (const [i] of order){
    const a = -Math.PI/2 + i*STEPA() + wheelA;
    const bx = x + Math.cos(a)*r, by = y + Math.sin(a)*r;
    const d = Math.atan2(Math.sin(a+Math.PI/2), Math.cos(a+Math.PI/2));
    const near = Math.max(0, 1 - Math.abs(d)/STEPA());   // 越靠近裝填口越大
    const base = save.magCap >= 5 ? 10.5 : 12.5;
    const br = base + (R-base)*near;

    ctx.beginPath(); ctx.arc(bx,by,br+4,0,7);
    ctx.fillStyle='rgba(5,7,12,.7)'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.arc(bx,by,br+3.6,Math.PI*1.05,Math.PI*1.98); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(bx,by,br+3.4,Math.PI*.06,Math.PI*.94); ctx.stroke();

    if (clownLeft > 0){ drawClown(bx, by, br); continue; }
    let b = mag[i];
    if (near > .55 && armed && armed.key === 'rain') b = {color:'#ffffff', type:'normal'};
    drawBubble(bx, by, b, br);
  }

  // 中心軸（點擊提示）
  let hg = ctx.createRadialGradient(x-5,y-6,1.5, x,y,16);
  hg.addColorStop(0,'#8e9ac0'); hg.addColorStop(.55,'#454f6e'); hg.addColorStop(1,'#1e2434');
  ctx.beginPath(); ctx.arc(x,y,14.5,0,7); ctx.fillStyle=hg; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(x,y,12.5,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
  ctx.fillStyle='rgba(232,236,245,.8)';
  ctx.font='600 16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('↻', x, y+1);

  // 裝填口卡榫（固定不轉）
  ctx.save();
  ctx.shadowColor='rgba(255,209,102,.55)'; ctx.shadowBlur=9;
  ctx.strokeStyle= armed ? 'rgba(255,209,102,1)' : 'rgba(255,209,102,.85)';
  ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(SHOOTER.x, SHOOTER.y, R+5.5, Math.PI*.13, Math.PI*.87); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='rgba(255,209,102,.9)';
  for (const s of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(SHOOTER.x + s*(R+4), SHOOTER.y-3);
    ctx.lineTo(SHOOTER.x + s*(R+11), SHOOTER.y-7);
    ctx.lineTo(SHOOTER.x + s*(R+11), SHOOTER.y+2);
    ctx.closePath(); ctx.fill();
  }
}

/* ══════════ 動態背景 ══════════ */
let bgT = 0, bgHue = 210, bgBlobs = [], bgBubs = [], bgStars = [];
function initBackdrop(){
  bgHue = Math.random()*360;
  bgBlobs = [];
  for (let i=0;i<4;i++) bgBlobs.push({
    x:Math.random()*W, y:Math.random()*H, r:130+Math.random()*170,
    vx:(Math.random()-.5)*.20, vy:(Math.random()-.5)*.15,
    h:(bgHue + i*48 + Math.random()*26)%360, ph:Math.random()*6.28
  });
  bgBubs = [];
  for (let i=0;i<15;i++) bgBubs.push({
    x:Math.random()*W, y:Math.random()*H, r:6+Math.random()*26,
    v:.10+Math.random()*.32, sw:Math.random()*6.28, amp:5+Math.random()*16,
    a:.05+Math.random()*.08, h:(bgHue+Math.random()*100)%360
  });
  bgStars = [];
  for (let i=0;i<44;i++) bgStars.push({
    x:Math.random()*W, y:Math.random()*H*.9, r:.6+Math.random()*1.3, ph:Math.random()*6.28
  });
}

function drawBackdrop(){
  bgT += 0.016;
  const heat  = Math.max(0, Math.min(1, tensionLv));
  const boost = (1 + Math.min(chain||0, 5)*0.18) * (bonus ? 1.9 : 1);

  const base = ctx.createLinearGradient(0,0,0,H);
  base.addColorStop(0,  'hsl('+((bgHue+22)%360)+',36%,'+(13+heat*4)+'%)');
  base.addColorStop(.55,'hsl('+bgHue+',30%,8%)');
  base.addColorStop(1,  'hsl('+((bgHue+330)%360)+',28%,5%)');
  ctx.fillStyle = base; ctx.fillRect(-20,-20,W+40,H+40);

  // 極光團（加色混合、緩慢漂移）
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of bgBlobs){
    b.x += b.vx; b.y += b.vy;
    if (b.x < -b.r) b.x = W+b.r; else if (b.x > W+b.r) b.x = -b.r;
    if (b.y < -b.r) b.y = H+b.r; else if (b.y > H+b.r) b.y = -b.r;
    const pr = b.r*(1 + .09*Math.sin(bgT*.7 + b.ph));
    const hue = b.h*(1-heat) + 352*heat;
    const g = ctx.createRadialGradient(b.x,b.y,0, b.x,b.y,pr);
    g.addColorStop(0,  'hsla('+hue+',74%,54%,'+(0.13*boost)+')');
    g.addColorStop(.5, 'hsla('+hue+',72%,44%,'+(0.05*boost)+')');
    g.addColorStop(1,  'hsla('+hue+',72%,40%,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x,b.y,pr,0,7); ctx.fill();
  }
  ctx.restore();

  // 星點閃爍
  for (const st of bgStars){
    ctx.globalAlpha = .22 + .34*Math.abs(Math.sin(bgT*1.4 + st.ph));
    ctx.fillStyle = '#dfe8ff';
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 背景飄浮泡（視差、左右擺盪）
  for (const b of bgBubs){
    b.y -= b.v; b.sw += .012;
    if (b.y < -b.r-12){ b.y = H+b.r+12; b.x = Math.random()*W; }
    const x = b.x + Math.sin(b.sw)*b.amp;
    const g = ctx.createRadialGradient(x-b.r*.3, b.y-b.r*.35, b.r*.04, x, b.y, b.r);
    g.addColorStop(0,  'hsla('+b.h+',85%,82%,'+(b.a*.45)+')');
    g.addColorStop(.72,'hsla('+b.h+',72%,58%,'+(b.a*.3)+')');
    g.addColorStop(1,  'hsla('+b.h+',88%,80%,'+(b.a*1.6)+')');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'hsla('+b.h+',92%,86%,'+(b.a*1.1)+')';
    ctx.lineWidth = 1; ctx.stroke();
  }

  // 暗角
  const vg = ctx.createRadialGradient(W/2, H*.44, H*.26, W/2, H*.5, H*.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(-20,-20,W+40,H+40);
}

function easeOutBack(x){ const c=2.1; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); }

function drawFloaters(){
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
  for (const f of floaters){
    const fade = f.kind === 'gift' ? .28 : .3;
    const alpha = f.life > fade ? 1 : f.life/fade;
    let sc = 1, size = 17, glow = 0;

    if (f.kind === 'praise'){
      sc = f.t < 11 ? easeOutBack(f.t/11) : 1 + .035*Math.sin(f.t*.16);
      size = 30*(f.big||1); glow = 20;
    } else if (f.kind === 'gift'){
      sc = f.t < 12 ? easeOutBack(f.t/12) : 1;
      size = 25; glow = 18;
    } else if (f.kind === 'reveal'){
      sc = f.t < 13 ? easeOutBack(f.t/13) : 1 + .018*Math.sin(f.t*.09);
      size = 31; glow = 26;
    } else if (f.kind === 'item'){
      sc = f.t < 9 ? easeOutBack(f.t/9) : 1; size = 21; glow = 14;
    } else if (f.kind === 'score'){
      sc = f.t < 6 ? .5 + .5*(f.t/6) : 1; size = 16; glow = 8;
    } else {
      sc = f.t < 8 ? easeOutBack(f.t/8) : 1; size = 17; glow = 10;
    }

    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.kind === 'praise' ? f.rot : 0);
    ctx.scale(sc, sc);
    ctx.globalAlpha = Math.max(alpha, 0);

    if (f.kind === 'gift'){                         // 原地浮出的開箱提示
      ctx.textAlign='center'; ctx.textBaseline='middle';
      if (f.head){
        ctx.font = '700 ' + (size*.46) + 'px "Noto Sans TC",system-ui,sans-serif';
        ctx.lineWidth = size*.17; ctx.strokeStyle = 'rgba(8,10,18,.92)';
        ctx.strokeText(f.head, 0, -size*.94);
        ctx.fillStyle = 'rgba(255,255,255,.78)';
        ctx.fillText(f.head, 0, -size*.94);
      }
      ctx.font = '800 ' + size + 'px "Segoe UI","Noto Sans TC",system-ui,sans-serif';
      const gg = ctx.createLinearGradient(0,-size*.6,0,size*.6);
      gg.addColorStop(0,'hsl('+f.hue+',100%,93%)');
      gg.addColorStop(.5,'hsl('+f.hue+',96%,66%)');
      gg.addColorStop(1,'hsl('+(f.hue-16)+',92%,52%)');
      const main = (f.ico ? f.ico + ' ' : '') + f.text;
      ctx.lineWidth = size*.22; ctx.strokeStyle = 'rgba(8,10,18,.92)';
      ctx.strokeText(main, 0, 0);
      ctx.shadowColor = 'hsla('+f.hue+',100%,62%,.85)'; ctx.shadowBlur = 18;
      ctx.fillStyle = gg; ctx.fillText(main, 0, 0);
      ctx.shadowBlur = 0;
      if (f.sub){
        ctx.font = '600 ' + (size*.52) + 'px "Noto Sans TC",system-ui,sans-serif';
        ctx.lineWidth = size*.17; ctx.strokeStyle = 'rgba(8,10,18,.9)';
        ctx.strokeText(f.sub, 0, size*.88);
        ctx.fillStyle = 'rgba(240,246,255,.96)';
        ctx.fillText(f.sub, 0, size*.88);
      }
      ctx.restore();
      continue;
    }
    if (f.kind === 'reveal'){                       // 底卡，讓字在任何背景都讀得到
      ctx.font = '800 ' + size + 'px "Noto Sans TC",system-ui,sans-serif';
      const wName = ctx.measureText(f.text).width;
      ctx.font = '600 ' + (size*.5) + 'px "Noto Sans TC",system-ui,sans-serif';
      const wTip = f.sub ? ctx.measureText(f.sub).width : 0;
      const cw = Math.max(wName, wTip, 168) + 64, chh = 152;
      ctx.fillStyle = 'rgba(10,13,22,.86)';
      ctx.beginPath(); ctx.roundRect(-cw/2, -chh/2, cw, chh, 20); ctx.fill();
      const bd = ctx.createLinearGradient(-cw/2,0,cw/2,0);
      bd.addColorStop(0,'hsl('+f.hue+',95%,72%)');
      bd.addColorStop(.5,'hsl('+(f.hue+18)+',100%,86%)');
      bd.addColorStop(1,'hsl('+f.hue+',95%,72%)');
      ctx.strokeStyle = bd; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.roundRect(-cw/2, -chh/2, cw, chh, 20); ctx.stroke();
      ctx.font = (size*1.7) + 'px system-ui';
      ctx.fillStyle = '#fff';
      ctx.fillText(f.ico || '🎁', 0, -chh*0.24);
      ctx.font = '600 ' + (size*.42) + 'px "Noto Sans TC",system-ui,sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillText(f.head || '得到了', 0, -chh*0.46);
      if (f.queued){
        ctx.font = '600 ' + (size*.36) + 'px "Noto Sans TC",system-ui,sans-serif';
        ctx.fillStyle = 'rgba(255,209,102,.9)';
        ctx.fillText('還有 ' + f.queued + ' 個', 0, chh*0.40);
      }
    }

    const w = f.kind==='praise' ? 800 : 700;
    ctx.font = w + ' ' + size + 'px "Segoe UI","Noto Sans TC",system-ui,sans-serif';

    const g = ctx.createLinearGradient(0, -size*.7, 0, size*.7);
    g.addColorStop(0, 'hsl('+f.hue+',100%,92%)');
    g.addColorStop(.48,'hsl('+f.hue+',95%,66%)');
    g.addColorStop(1, 'hsl('+(f.hue-16)+',92%,52%)');

    ctx.lineWidth = size*0.22;
    ctx.strokeStyle = 'rgba(8,10,18,.9)';
    ctx.strokeText(f.text, 0, f.kind==='reveal' ? size*0.52 : 0);
    if (glow){ ctx.shadowColor = 'hsla('+f.hue+',100%,62%,.85)'; ctx.shadowBlur = glow; }
    ctx.fillStyle = g;
    ctx.fillText(f.text, 0, f.kind==='reveal' ? size*0.52 : 0);
    ctx.shadowBlur = 0;

    if (f.sub){
      const sy = f.kind==='reveal' ? size*1.32 : size*0.82;
      ctx.font = (f.kind==='reveal' ? '600 ' : '700 ') +
                 (size*(f.kind==='reveal' ? 0.5 : 0.42)) + 'px "Noto Sans TC",system-ui,sans-serif';
      ctx.lineWidth = size*0.13;
      if (f.kind !== 'reveal') ctx.strokeText(f.sub, 0, sy);
      ctx.fillStyle = f.kind==='reveal' ? 'rgba(232,236,245,.9)' : 'rgba(255,255,255,.95)';
      ctx.fillText(f.sub, 0, sy);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function draw(){
  ctx.save();
  if (shakeT>0) ctx.translate((Math.random()-.5)*shakeT*.5,(Math.random()-.5)*shakeT*.5);
  ctx.clearRect(-20,-20,W+40,H+40);

  drawBackdrop();

  // 天花板
  ctx.fillStyle='#1c2233'; ctx.fillRect(0,0,W,TOP);
  if (nextRow){                                    // 下一列預覽
    for (let c=0;c<nextRow.cells.length;c++){
      const b = nextRow.cells[c]; if (!b) continue;
      ctx.globalAlpha = .5; ctx.fillStyle = 'rgba(150,160,185,.9)';
      ctx.fillRect(c*D+R-3, 3, 6, 4);
    }
    ctx.globalAlpha = 1;
  }
  // 底線
  ctx.save(); ctx.setLineDash([3,7]);
  ctx.strokeStyle='rgba(255,93,115,.42)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,DEATH); ctx.lineTo(W,DEATH); ctx.stroke(); ctx.restore();

  const aim = (state==='play' && (bonus || !shots.length)) ? traceAim() : null;

  ctx.save(); ctx.translate(0, dropOff||0);         // 下降滑動位移
  for (let r=0;r<grid.length;r++)
    for (let c=0;c<len(r);c++)
      if (grid[r].cells[c]) drawBubble(cx(r,c),cy(r),grid[r].cells[c]);
  if (aim) drawPreview(aim);
  ctx.restore();

  for (const u of rise){                            // 🌊 逆流中的泡泡
    ctx.save();
    ctx.globalAlpha = .35 + .25*Math.sin(u.glow);
    ctx.strokeStyle = u.gift ? '#ffd166' : '#9fe8ff';
    ctx.lineWidth = u.gift ? 2.8 : 2;
    ctx.beginPath(); ctx.arc(u.x, u.y, R+3.5, 0, 7); ctx.stroke();
    if (u.gift){
      ctx.globalAlpha = .22 + .18*Math.sin(u.glow*1.4);
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(u.x, u.y, R+8, 0, 7); ctx.stroke();
    }
    ctx.restore();
    drawBubble(u.x, u.y, u.b);
    ctx.save();
    ctx.globalAlpha = .5;
    ctx.fillStyle = u.gift ? 'rgba(255,209,102,.85)' : 'rgba(159,232,255,.8)';
    for (let k=1;k<=3;k++){
      const ry = u.y + R + k*9, rr = 3.2 - k*0.7;
      if (rr > 0.4) { ctx.beginPath(); ctx.arc(u.x + Math.sin(u.sw-k*0.6)*4, ry, rr, 0, 7); ctx.fill(); }
    }
    ctx.restore();
  }
  for (const k of shocks){                           // 衝擊波
    ctx.save();
    ctx.globalAlpha = Math.max(k.life,0)*0.75;
    ctx.strokeStyle = 'hsl('+k.hue+',95%,68%)';
    ctx.lineWidth = 3.5*k.life + 1;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 7); ctx.stroke();
    ctx.globalAlpha = Math.max(k.life,0)*0.30;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r*0.62, 0, 7); ctx.stroke();
    ctx.restore();
  }
  drawCat();
  for (const f of falling) drawBubble(f.x,f.y,f.b);

  for (const p of particles){
    ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,4*p.life+1,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  if (state==='play'){
    if (aim) guide(aim);
    drawWheel();
    if (bonus){
      const cw = W-24;
      ctx.save();
      ctx.fillStyle = 'rgba(10,13,22,.72)';
      ctx.beginPath(); ctx.roundRect(12, TOP+8, cw, 22, 11); ctx.fill();
      ctx.strokeStyle = 'rgba(120,255,190,.7)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.roundRect(12, TOP+8, cw, 22, 11); ctx.stroke();
      const pct = bonus.left / BONUS_SHOTS;
      const bgd = ctx.createLinearGradient(12,0,12+cw,0);
      bgd.addColorStop(0,'#4dd4ac'); bgd.addColorStop(1,'#ffd166');
      ctx.fillStyle = bgd;
      ctx.beginPath(); ctx.roundRect(14, TOP+10, Math.max((cw-4)*pct,3), 18, 9); ctx.fill();
      ctx.fillStyle = '#0f1117'; ctx.font = '700 13px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🔥 剩 ' + bonus.left + ' 發　×' + BONUS_MULT + ' 分', W/2, TOP+19);
      ctx.restore();

      if (bonus.phase === 'count'){                 // 3・2・1
        const n = 3 - Math.floor(bonus.t/36);
        const sub = (bonus.t % 36) / 36;
        ctx.save();
        ctx.translate(W/2, 250);
        ctx.scale(1 + (1-sub)*0.7, 1 + (1-sub)*0.7);
        ctx.globalAlpha = Math.min(1, (1-sub)*2.2);
        ctx.font = '800 96px "Segoe UI",system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.lineWidth = 14; ctx.strokeStyle = 'rgba(8,10,18,.9)'; ctx.lineJoin='round';
        ctx.strokeText(String(Math.max(n,1)), 0, 0);
        const cg2 = ctx.createLinearGradient(0,-60,0,60);
        cg2.addColorStop(0,'#ffffff'); cg2.addColorStop(.5,'#4dd4ac'); cg2.addColorStop(1,'#2f9c7c');
        ctx.shadowColor = 'rgba(77,212,172,.9)'; ctx.shadowBlur = 30;
        ctx.fillStyle = cg2; ctx.fillText(String(Math.max(n,1)), 0, 0);
        ctx.restore();
      }
    }
    if (clownLeft > 0){
      ctx.fillStyle='rgba(255,120,150,.95)'; ctx.font='700 14px system-ui'; ctx.textAlign='left';
      ctx.fillText('🤡 ×'+clownLeft, 14, TOP+50);
    }
    if (chain>=2){
      ctx.fillStyle='rgba(255,209,102,.9)'; ctx.font='700 15px system-ui'; ctx.textAlign='left';
      ctx.fillText('連鎖 '+chain, 14, TOP+72);
    }
  }
  for (const L of loose){                          // 亂彈中的泡泡
    ctx.save();
    ctx.globalAlpha = .35;
    ctx.strokeStyle = 'rgba(220,232,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(L.x, L.y, R+4+2*Math.sin(L.rot*4), 0, 7); ctx.stroke();
    ctx.restore();
    drawBubble(L.x, L.y, L.b);
  }
  for (const sh of shots){
    if (sh.kind === 'bowl'){ drawBowl(sh); continue; }
    drawBubble(sh.x, sh.y, sh.kind==='fire' ? {color:'#ff9f45',type:'normal'}
                         : sh.kind==='bomb' ? {color:'#8e9ab5',type:'bomb'} : sh.ball);
  }

  drawFloaters();
  ctx.restore();
}

/* ══════════ HUD / 道具 ══════════ */
function hud(){
  document.getElementById('hLevel').textContent = level;
  document.getElementById('hScore').textContent = score;
  const m = document.getElementById('hMoves');
  m.textContent = bonus ? '🔥'+bonus.left : Math.max(dropIn,0);
  m.className = 'v' + (!bonus && dropIn<=2 ? ' warn' : '');
  document.getElementById('hWave').textContent = rowsDropped;
}
const slotsEl = document.getElementById('slots');
let slotCount = -1;
function drawSlots(){
  const changed = (slotsEl.children.length !== save.slotCap);
  if (changed) slotsEl.innerHTML = '';
  for (let i=0;i<save.slotCap;i++){
    let el = slotsEl.children[i];
    if (!el){
      el = document.createElement('div');
      el.className = 'tool'; el.tabIndex = 0;
      el.innerHTML = '<span class="ico"></span><span class="lb"></span>';
      const use = () => useSlot(i);
      el.addEventListener('click', use);
      el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); use(); } });
      slotsEl.appendChild(el);
      el.classList.add('fresh');
    }
    const key = save.slots[i];
    const it = key ? ITEMS[key] : null;
    const ico = el.querySelector('.ico'), lb = el.querySelector('.lb');
    if (ico.textContent !== (it?it.ico:'·')) el.classList.add('fresh');
    ico.textContent = it ? it.ico : '·';
    lb.textContent  = it ? it.name : '空';
    el.title = it ? it.tip : '空格位';
    el.dataset.empty = it ? '0' : '1';
    el.dataset.armed = (armed && armed.i === i) ? '1' : '0';
    setTimeout(()=>el.classList.remove('fresh'), 360);
  }
}
function useSlot(i){
  if (state!=='play' || shots.length || loose.length || bowl || bonus) return;
  const key = save.slots[i];
  if (!key) return;
  const it = ITEMS[key];
  AUDIO.ui();
  if (it.kind !== 'shot') AUDIO.event('item', 1, key);
  if (it.kind === 'shot'){
    armed = (armed && armed.i === i) ? null : {i, key};
    if (armed) itemFx(it.ico + ' ' + it.name + ' 待發');
  } else {
    instant(key); save.slots.splice(i,1); armed = null; persist();
  }
  if (!slotsFull() && hasHeldOnWall()) fx('toast', '🔓 現在可以打禮物了', W/2, 300);
  drawSlots(); hud();
}

/* ── 立即生效類 ── */
function instant(key){
  if (key === 'lift'){
    const n = lift(1);
    itemFx('⬆️ 往上推了 '+n+' 列'); AUDIO.plus(); shakeT = 10;
  }
  else if (key === 'purge'){
    const tally = {};
    for (const row of grid) for (const b of row.cells) if (b && b.color) tally[b.color] = (tally[b.color]||0)+1;
    const keys = Object.keys(tally);
    if (!keys.length) return;
    const target = keys.sort((a,b)=>tally[b]-tally[a])[0];
    const cells = [];
    for (let r=0;r<grid.length;r++) for (let c=0;c<len(r);c++){
      const b = grid[r].cells[c];
      if (b && b.color === target) cells.push([r,c]);
    }
    const n = resolveClear(cells);
    const d = dropFloating();
    score += n*12 + d*25; shakeT = 10;
    itemFx('🌀 消除 '+n+' 顆'); praise(n, chain);
    if (d >= 6) spawnGift(null,null,1);
  }
  refill(); checkEnd();
}

const pauseEl = document.getElementById('tPause');
const doPause = () => {
  if (state !== 'play') return;
  state = 'done';
  showOverlay('暫停一下', '⏸', '離開前記得抄密碼！', '繼續玩',
    () => { state = 'play'; }, codeBlock());
};
pauseEl.addEventListener('click', doPause);
pauseEl.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); doPause(); } });

const muteEl = document.getElementById('tMute');
const doMute = () => { document.getElementById('muteIco').textContent = AUDIO.toggle() ? '🔊' : '🔇'; };
muteEl.addEventListener('click', doMute);
muteEl.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); doMute(); } });

/* ══════════ Overlay ══════════ */
const overlay = document.getElementById('overlay'), btn = document.getElementById('btn');
let onBtn = null;
const ovExtra = document.getElementById('ovExtra');
const ovCat = document.getElementById('ovCat');
/* 點小貓會跳一下並叫一聲（女兒指定功能）*/
ovCat.addEventListener('click', () => {
  if (ovCat.classList.contains('hop')) return;
  ovCat.classList.add('hop');
  AUDIO.start();
  AUDIO.meow((Math.random()*9)|0);
  setTimeout(() => ovCat.classList.remove('hop'), 640);
});
function showOverlay(title, starsTxt, text, label, fn, extra, withCat){
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovStars').textContent = starsTxt || '';
  document.getElementById('ovText').innerHTML = text;
  ovExtra.innerHTML = extra || '';
  btn.textContent = label; onBtn = fn;
  ovCat.classList.toggle('show', !!withCat);
  overlay.classList.add('show');
  wireExtra();
}
function codeBlock(){
  return '<div class="code">' + makeCode(bubbleCount()) + '</div>' +
         '<div class="hint">把這組密碼抄下來或拍照。<br>換手機、換電腦都能用它接著玩。</div>' +
         '<button class="mini" id="cpBtn">複製密碼</button>';
}
/* 安裝到主畫面 */
let deferredPrompt = null;
const isStandalone = () =>
  (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches)
  || navigator.standalone === true;
function installBlock(){
  if (isStandalone()) return '';
  if (deferredPrompt) return '<button class="mini" id="pwaBtn">📲 安裝到主畫面</button>';
  if (/iPad|iPhone|iPod/.test(navigator.userAgent || ''))
    return '<div class="hint">iPhone / iPad：點下方的「分享」→「加入主畫面」<br>就會變成一個 app，全螢幕又能離線玩</div>';
  return '';
}
function refreshInstallUI(){
  if (state === 'menu' && overlay.classList.contains('show')){
    ovExtra.innerHTML = resumeBlock(); wireExtra();
  }
}
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; refreshInstallUI();
});
addEventListener('appinstalled', () => { deferredPrompt = null; refreshInstallUI(); });

function resumeBlock(){
  return installBlock() +
         '<div class="row"><input id="codeIn" placeholder="輸入接關密碼" maxlength="14">' +
         '<button class="mini" id="okBtn">接關</button></div>' +
         '<div class="hint" id="codeMsg"></div>' +
         '<button class="mini" id="rsBtn" style="opacity:.55">清除所有紀錄</button>';
}
function wireExtra(){
  const cp = document.getElementById('cpBtn');
  if (cp) cp.onclick = () => {
    const t = ovExtra.querySelector('.code').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    cp.textContent = '已複製 ✓';
  };
  const pw = document.getElementById('pwaBtn');
  if (pw) pw.onclick = async () => {
    if (!deferredPrompt) return;
    pw.textContent = '安裝中…';
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(e){}
    deferredPrompt = null; refreshInstallUI();
  };
  const rs = document.getElementById('rsBtn');
  if (rs) rs.onclick = () => {
    try{ localStorage.removeItem(SAVE); }catch(e){}
    save = {level:1, score:0, best:0, stars:{}, slots:[], magCap:2, slotCap:1, stickers:[]};
    persist(); drawSlots();
    btn.textContent = '開始遊戲';
    onBtn = () => buildLevel(1);
    rs.textContent = '已清除 ✓';
  };
  const ok = document.getElementById('okBtn');
  if (ok) ok.onclick = () => {
    const d = readCode(document.getElementById('codeIn').value);
    const msg = document.getElementById('codeMsg');
    if (!d){ msg.textContent = '密碼看起來不太對，再檢查一次喔'; msg.style.color = '#ff5d73'; return; }
    applyCode(d);
    msg.style.color = '#4dd4ac';
    msg.textContent = '接關成功！第 ' + d.level + ' 階段，大約 ' + d.bubbles + ' 顆泡泡';
    btn.textContent = '從第 ' + d.level + ' 階段開始';
    onBtn = () => buildLevel(d.level, true);
  };
}
btn.addEventListener('click', () => {
  AUDIO.start();
  overlay.classList.remove('show');
  if (onBtn) onBtn();
  state = 'play';
});

/* ══════════ 啟動 ══════════ */
initBackdrop();
drawSlots();
buildLevel(save.level || 1);
state = 'menu';
score = save.score = save.score || 0;
hud();
btn.textContent = '開始遊戲';
onBtn = () => buildLevel(save.level||1);
ovExtra.innerHTML = resumeBlock(); wireExtra();
ovCat.classList.add('show');   // 開場一定要有小貓

/* ══════════ App 化：離線快取、螢幕常亮、前景恢復 ══════════ */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

let wakeLock = null;
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
  catch(e){}
}
let audioStarted = false;
btn.addEventListener('click', () => { audioStarted = true; keepAwake(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible'){
    keepAwake();
    if (audioStarted) AUDIO.start();          // iOS 切回前景後 AudioContext 會被暫停
  }
});

/* 迴圈加上防護罩：任何一幀出錯都不會讓整個遊戲停住 */
let errCount = 0;
(function loop(){
  try {
    if (state === 'play') update();
    draw();
  } catch (e){
    if (++errCount < 6) console.error('[frame error]', e);
    shots.length = 0; loose.length = 0; bowl = null;
  }
  requestAnimationFrame(loop);
})();
})();
</script>
